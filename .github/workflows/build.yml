name: Build Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release x64
        run: msbuild Andromeda-Dota2-Base.sln /m /p:Configuration=Release /p:Platform=x64

      - name: Collect binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Get-ChildItem -Recurse -File -Include *.dll,*.exe,*.pdb |
            Where-Object { $_.FullName -match '[\\/](Release|x64)[\\/]' } |
            Copy-Item -Destination artifacts -Force

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: Andromeda-Dota2-Base-Release-x64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7
